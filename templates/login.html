<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='imgs/logo.jpg') }}">
</head>
<body class="pagina-login">

<div class="card login-card">
  <div class="card-header text-center fs-2 fw-bold">Guardian Segurança Eletrônica</div>
  <div class="card-body">
    <h2 class="text-center mb-4">Login</h2>
    {% for categoria, m in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ categoria if categoria in ['danger', 'success'] else 'danger' }}">{{ m }}</div>
    {% endfor %}
    <form method="post">
      <label class="form-label">E-mail:</label>
      <input class="form-control mb-3" type="email" name="email" placeholder="Digite seu e-mail">
      <label class="form-label">Password:</label>
      <input class="form-control mb-3" type="password" name="senha" placeholder="Digite sua senha">
      <button class="btn btn-guardian w-100 mb-3">Entrar</button>
      <div class="text-center mb-3"><a href="#">Recuperar Senha</a></div>
      <a class="btn btn-primary w-100" href="{{ url_for('cadastro_publico') }}">CADASTRAR</a>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
