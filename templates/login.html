<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="card mx-auto" style="width:550px">
  <div class="card-header text-center fs-2 fw-bold">Loja Segurança</div>
  <div class="card-body">
    <h2 class="text-center mb-4">Login</h2>
    {% for m in get_flashed_messages() %}
    <div class="alert alert-danger">{{ m }}</div>
    {% endfor %}
    <form method="post">
      <label class="form-label">E-mail:</label>
      <input class="form-control mb-3" type="email" name="email" placeholder="Digite seu e-mail">
      <label class="form-label">Password:</label>
      <input class="form-control mb-3" type="password" name="senha" placeholder="Digite sua senha">
      <button class="btn btn-danger w-100 mb-3">Entrar</button>
      <div class="text-center mb-3"><a href="#">Recuperar Senha</a></div>
      <a class="btn btn-primary w-100" href="{{ url_for('cadastrar', entidade='usuarios') }}">CADASTRAR</a>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
